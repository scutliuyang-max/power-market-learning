name: Deploy learning app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/data.js
          node --check dist/planner-engine.js
          node --check dist/planner-policy.js
          node --check dist/planner-ui.js
          node --check server.mjs
          node tests/planner.test.cjs
          node --check dist/document-library.js
          node --check dist/library-ui.js
          node tests/library.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
